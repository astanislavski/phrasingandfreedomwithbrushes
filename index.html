<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- Instantly forwards the browser to the new URL -->
    <meta http-equiv="refresh" content="0; URL=https://www.thebrushmethod.com/store/books">
    <!-- Keeps search engine authority intact -->
    <link rel="canonical" href="https://www.thebrushmethod.com/store/books">
</head>
<body>
    <p>Please wait while you are redirected. If you are not forwarded automatically, 
       <a href="https://www.thebrushmethod.com/store/books">click here</a>.
    </p>
</body>
</html>
